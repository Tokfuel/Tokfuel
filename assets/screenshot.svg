<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" font-family="-apple-system, SF Pro Display, Helvetica, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2E33"/>
      <stop offset="1" stop-color="#1B1B1F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8927C"/>
      <stop offset="1" stop-color="#D97757"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="720" height="560" fill="url(#wall)"/>

  <!-- Menu bar strip -->
  <rect x="0" y="0" width="720" height="28" fill="#0E0E12" opacity="0.8"/>
  <text x="190" y="19" font-size="12" fill="#9A9A9A">File  Edit  View  Window  Help</text>
  <text x="540" y="19" font-size="12" fill="#9A9A9A">Wi-Fi</text>
  <!-- Active fuel pump icon -->
  <g transform="translate(596,8)">
    <g fill="#D97757">
      <rect x="0" y="2" width="9" height="11" rx="2"/>
      <rect x="2" y="4" width="5" height="3.5" rx="1" fill="#0E0E12"/>
      <rect x="-1.5" y="12" width="12" height="2.2" rx="1.1"/>
      <path d="M10 8.5 C 12.5 8.5 12.5 7 12 4 L 11.4 2.4" fill="none" stroke="#D97757" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <text x="18" y="11" font-size="12" fill="#E8C2B4">$12.34</text>
  </g>
  <text x="688" y="19" font-size="12" fill="#CCCCCC">22:51</text>

  <!-- Popover panel (360x508) -->
  <g transform="translate(330,36)">
    <rect width="360" height="508" rx="14" fill="#1C1C20" stroke="#3A3A40" stroke-width="1" filter="url(#shadow)"/>
    <rect width="360" height="508" rx="14" fill="#1C1C20" stroke="#3A3A40" stroke-width="1"/>

    <!-- Hero: today's cost -->
    <g transform="translate(16,24)">
      <text font-size="11" fill="#9A9A9A">今日</text>
      <text y="36" font-size="34" font-weight="700" fill="#FFFFFF">$12.34</text>
      <text y="54" font-size="11" fill="#9A9A9A">42 プロンプト · 6 セッション</text>
    </g>

    <!-- Budget (today) -->
    <g transform="translate(16,102)">
      <text font-size="11" fill="#9A9A9A">予算 (今日)</text>
      <text x="328" font-size="11" text-anchor="end" fill="#9A9A9A">$12.34 / $20</text>
      <rect y="7" width="328" height="6" rx="3" fill="#2C2C32"/>
      <rect y="7" width="202" height="6" rx="3" fill="url(#accent)"/>
      <rect x="262" y="7" width="1" height="6" fill="#55555C"/>
    </g>

    <!-- Budget (month) -->
    <g transform="translate(16,132)">
      <text font-size="11" fill="#9A9A9A">予算 (今月)</text>
      <text x="328" font-size="11" text-anchor="end" fill="#EFA862">$210 / $300</text>
      <rect y="7" width="328" height="6" rx="3" fill="#2C2C32"/>
      <rect y="7" width="230" height="6" rx="3" fill="#E8923C"/>
      <rect x="262" y="7" width="1" height="6" fill="#55555C"/>
      <text y="26" font-size="10" fill="#EFA862">⚠ 残り $90</text>
    </g>

    <!-- Trend: header + segmented picker -->
    <g transform="translate(16,182)">
      <text y="12" font-size="11" font-weight="600" fill="#9A9A9A">推移</text>
      <g transform="translate(178,0)">
        <rect width="150" height="20" rx="5" fill="#2C2C32"/>
        <rect x="50" width="50" height="20" rx="5" fill="#4A4A52"/>
        <text x="25" y="14" font-size="10" text-anchor="middle" fill="#9A9A9A">今日</text>
        <text x="75" y="14" font-size="10" text-anchor="middle" fill="#FFFFFF">7日</text>
        <text x="125" y="14" font-size="10" text-anchor="middle" fill="#9A9A9A">30日</text>
      </g>
      <!-- Bar chart -->
      <g transform="translate(0,32)">
        <line x1="0" y1="0" x2="328" y2="0" stroke="#2C2C32"/>
        <line x1="0" y1="40" x2="328" y2="40" stroke="#2C2C32"/>
        <line x1="0" y1="80" x2="328" y2="80" stroke="#2C2C32"/>
        <text x="334" y="4" font-size="9" fill="#777">$30</text>
        <text x="334" y="44" font-size="9" fill="#777">$15</text>
        <g fill="url(#accent)">
          <rect x="8"   y="52" width="30" height="28" rx="2"/>
          <rect x="54"  y="34" width="30" height="46" rx="2"/>
          <rect x="100" y="60" width="30" height="20" rx="2"/>
          <rect x="146" y="20" width="30" height="60" rx="2"/>
          <rect x="192" y="44" width="30" height="36" rx="2"/>
          <rect x="238" y="8"  width="30" height="72" rx="2"/>
          <rect x="284" y="38" width="30" height="42" rx="2"/>
        </g>
        <g font-size="9" fill="#777" text-anchor="middle">
          <text x="23"  y="94">07/22</text>
          <text x="115" y="94">07/24</text>
          <text x="207" y="94">07/26</text>
          <text x="299" y="94">07/28</text>
        </g>
      </g>
    </g>

    <!-- Stats row -->
    <g transform="translate(16,330)" text-anchor="middle">
      <g transform="translate(54,0)">
        <text font-size="14" font-weight="600" fill="#FFFFFF">$82.65</text>
        <text y="15" font-size="9" fill="#9A9A9A">期間合計</text>
      </g>
      <g transform="translate(164,0)">
        <text font-size="14" font-weight="600" fill="#FFFFFF">86%</text>
        <text y="15" font-size="9" fill="#9A9A9A">キャッシュヒット</text>
      </g>
      <g transform="translate(274,0)">
        <text font-size="14" font-weight="600" fill="#FFFFFF">$0.28</text>
        <text y="15" font-size="9" fill="#9A9A9A">プロンプト単価</text>
      </g>
    </g>

    <!-- By model -->
    <g transform="translate(16,376)">
      <text font-size="11" font-weight="600" fill="#9A9A9A">モデル別</text>
      <g transform="translate(0,12)" font-size="10">
        <text y="9" fill="#CCCCCC">fable-5</text>
        <rect x="104" y="2" width="164" height="8" rx="4" fill="#55555C" opacity="0.7"/>
        <text x="328" y="9" text-anchor="end" fill="#9A9A9A">$71.20</text>
        <text y="27" fill="#CCCCCC">haiku-4-5</text>
        <rect x="104" y="20" width="26" height="8" rx="4" fill="#55555C" opacity="0.7"/>
        <text x="328" y="27" text-anchor="end" fill="#9A9A9A">$11.45</text>
      </g>
    </g>

    <!-- Top sessions -->
    <g transform="translate(16,434)">
      <text font-size="11" font-weight="600" fill="#9A9A9A">高コストのセッション</text>
      <g transform="translate(0,10)" font-size="10">
        <text y="9" fill="#CCCCCC">akidon0000/tokfuel</text>
        <text x="328" y="9" text-anchor="end" fill="#9A9A9A">$9.90</text>
        <text y="25" fill="#CCCCCC">sansaninc/mobile-app</text>
        <text x="328" y="25" text-anchor="end" fill="#9A9A9A">$7.42</text>
      </g>
    </g>

    <!-- Footer -->
    <line x1="0" y1="478" x2="360" y2="478" stroke="#2C2C32" stroke-width="1"/>
    <text x="16" y="497" font-size="10" fill="#777">更新 22:51</text>
    <g transform="translate(330,486)">
      <circle cx="7" cy="7" r="8" fill="none" stroke="#9A9A9A" stroke-width="1.2"/>
      <circle cx="3.5" cy="7" r="1.1" fill="#9A9A9A"/>
      <circle cx="7"   cy="7" r="1.1" fill="#9A9A9A"/>
      <circle cx="10.5" cy="7" r="1.1" fill="#9A9A9A"/>
    </g>
  </g>
</svg>
