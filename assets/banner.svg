<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1B1F"/>
      <stop offset="1" stop-color="#2A1C16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8927C"/>
      <stop offset="1" stop-color="#D97757"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- Faux menu bar strip -->
  <rect x="0" y="0" width="1280" height="36" fill="#0E0E12" opacity="0.65"/>
  <g transform="translate(1130,10)">
    <!-- fuel pump glyph -->
    <g fill="url(#accent)">
      <rect x="0" y="2" width="10" height="13" rx="2"/>
      <rect x="2" y="4" width="6" height="4" rx="1" fill="#0E0E12"/>
      <rect x="-1.5" y="14" width="13" height="2.5" rx="1.2"/>
      <path d="M11 10 C 14 10 14 8 13.4 4.5 L 12.6 2.5" fill="none" stroke="#E8927C" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="20" y="13" font-family="-apple-system, SF Pro Display, Helvetica, sans-serif" font-size="13" fill="#E8C2B4">$12.34</text>
  </g>

  <!-- Logo -->
  <g transform="translate(120,90)">
    <rect width="180" height="180" rx="40" fill="url(#accent)"/>
    <g transform="translate(38,34)">
      <!-- pump body -->
      <rect x="0" y="0" width="76" height="102" rx="10" fill="#FFFFFF"/>
      <rect x="12" y="12" width="52" height="32" rx="6" fill="#D97757"/>
      <!-- base -->
      <rect x="-8" y="102" width="92" height="12" rx="6" fill="#FFFFFF"/>
      <!-- hose + nozzle -->
      <path d="M84 66 C 104 66 106 54 102 30" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
      <rect x="90" y="6" width="18" height="22" rx="5" fill="#FFFFFF" transform="rotate(14 99 17)"/>
    </g>
  </g>

  <!-- Title block -->
  <g transform="translate(340,140)" font-family="-apple-system, SF Pro Display, Helvetica, sans-serif" fill="#FFFFFF">
    <text font-size="60" font-weight="700">Tokfuel</text>
    <text y="46" font-size="22" fill="#E8C8BC">See what Claude Code costs you — from the menu bar.</text>
    <g transform="translate(0,92)">
      <rect width="150" height="32" rx="16" fill="#2E2018" stroke="#D97757" stroke-width="1"/>
      <text x="75" y="21" font-size="14" text-anchor="middle" fill="#E8B49E">macOS 14+ · SwiftUI</text>
      <rect x="166" width="120" height="32" rx="16" fill="#2E2018" stroke="#D97757" stroke-width="1"/>
      <text x="226" y="21" font-size="14" text-anchor="middle" fill="#E8B49E">MIT License</text>
      <rect x="302" width="130" height="32" rx="16" fill="#2E2018" stroke="#D97757" stroke-width="1"/>
      <text x="367" y="21" font-size="14" text-anchor="middle" fill="#E8B49E">100% local</text>
    </g>
  </g>
</svg>
