<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Tokfuel SPM layer architecture</title>
  <desc id="desc">Dependency flow UI to Store to sources. The Tokfuel executable wires concrete types. Settings, Analytics, and Core sit beside the main stack.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/>
    </marker>
  </defs>

  <rect x="160" y="16" width="400" height="56" rx="12" fill="#1d1d1f" stroke="#1d1d1f" stroke-width="1.5"/>
  <text x="360" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f5f5f7">Tokfuel</text>
  <text x="360" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#a1a1a6">executable · DI / wiring</text>

  <path d="M360 72 V 96" stroke="#6e6e73" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="160" y="96" width="400" height="56" rx="12" fill="#e8f1fc" stroke="#0071e3" stroke-width="1.5"/>
  <text x="360" y="120" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d1d1f">TokfuelUI</text>
  <text x="360" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73">Popover · Settings · About · presentation</text>

  <path d="M360 152 V 176" stroke="#6e6e73" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="372" y="170" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6e6e73">depends on</text>

  <rect x="160" y="176" width="400" height="56" rx="12" fill="#e8f1fc" stroke="#0071e3" stroke-width="1.5"/>
  <text x="360" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d1d1f">TokfuelStore</text>
  <text x="360" y="218" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73">UsageStore · shape / aggregate for UI</text>

  <path d="M300 232 C 300 250, 102 250, 102 268" stroke="#6e6e73" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M340 232 C 340 250, 270 250, 270 268" stroke="#6e6e73" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M380 232 C 380 250, 438 250, 438 268" stroke="#6e6e73" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M420 232 C 420 250, 612 250, 612 268" stroke="#6e6e73" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="372" y="258" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6e6e73">depends on</text>

  <rect x="24" y="268" width="156" height="72" rx="12" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.5"/>
  <text x="102" y="298" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d1d1f">TokfuelClaude</text>
  <text x="102" y="318" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73">retok · transcripts</text>

  <rect x="192" y="268" width="156" height="72" rx="12" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.5"/>
  <text x="270" y="298" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d1d1f">TokfuelCursor</text>
  <text x="270" y="318" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73">dashboard · pricing</text>

  <rect x="360" y="268" width="156" height="72" rx="12" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.5"/>
  <text x="438" y="298" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d1d1f">TokfuelCodex</text>
  <text x="438" y="318" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73">CLI sessions</text>

  <rect x="528" y="268" width="168" height="72" rx="12" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.5"/>
  <text x="612" y="298" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d1d1f">TokfuelBudget</text>
  <text x="612" y="318" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73">thresholds · alerts</text>

  <text x="24" y="372" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6e6e73">Shared · settings · diagnostics</text>

  <rect x="24" y="384" width="216" height="56" rx="12" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.5"/>
  <text x="132" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d1d1f">TokfuelSettings</text>
  <text x="132" y="426" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73">AppSettings · UserDefaults</text>

  <rect x="252" y="384" width="216" height="56" rx="12" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.5"/>
  <text x="360" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d1d1f">TokfuelAnalytics</text>
  <text x="360" y="426" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73">opt-in · Crashlytics (dist)</text>

  <rect x="480" y="384" width="216" height="56" rx="12" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.5"/>
  <text x="588" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d1d1f">TokfuelCore</text>
  <text x="588" y="426" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73">shared types only</text>

  <text x="24" y="476" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6e6e73">Local data on disk ? sources fetch ? Store shapes ? UI presents. Prompts never leave the Mac.</text>
  <text x="24" y="496" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6e6e73">Arrow direction = import / depends-on (UI ? Store ? sources).</text>
</svg>
