name: Pages

# main への push で、ダウンロードページ（Site/）を再生成して GitHub Pages に公開する。
# ダウンロードボタンは releases/latest を指す固定URLなので、ここではページ自体の
# 再生成だけを行う（リリースそのものは release.yml が別途担当する）。
on:
  push:
    branches: [main]
    paths: ["Site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Build download page
        working-directory: Site
        run: swift run

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Site/Build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
