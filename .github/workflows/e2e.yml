name: E2E メニューバー

# TestDocs シナリオを、実際のメニューバー操作で通す（macos-15）。
# 失敗時は証拠（画面・挙動 GIF・前回成功画面）を orphan ブランチへ載せ、PR コメントする。
# `e2e 🧪` ラベルを付けると再実行する（ui-preview 📸 と同型。起動後にラベルは外す）。
on:
  push:
    branches: [main]
    paths:
      - "App/Tokfuel/**"
      - "App/TokfuelUI/**"
      - "App/TokfuelStore/**"
      - "App/TokfuelBudget/**"
      - "App/TokfuelCore/**"
      - "App/Tests/E2E/**"
      - "App/Tests/TestDocs/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/e2e.yml"
  pull_request:
    # labeled を paths と併用すると発火しないことがあるため、パス判定は gate ジョブへ移す。
    types: [opened, synchronize, reopened, closed, labeled]

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$ACTION" == "labeled" ]]; then
            if [[ "$LABEL" == "e2e 🧪" ]]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          files="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -qE \
            '^(App/Tokfuel/|App/TokfuelUI/|App/TokfuelStore/|App/TokfuelBudget/|App/TokfuelCore/|App/Tests/E2E/|App/Tests/TestDocs/|Package\.swift$|Package\.resolved$|\.github/workflows/e2e\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: E2E ${{ matrix.suite }}
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        suite: [core6, Budget, Cost, Cursor, MenuBar, Settings]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # 付けたままだと再ラベルできないので、起動したら外す（再実行用）。
      - name: Consume e2e label
        if: github.event.action == 'labeled' && matrix.suite == 'core6'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label "e2e 🧪"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: e2e-spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ hashFiles('App/Tokfuel/**', 'App/TokfuelUI/**', 'App/TokfuelStore/**', 'App/Tests/E2E/Driver/**') }}
          restore-keys: |
            e2e-spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            e2e-spm-${{ runner.os }}-

      - name: Build
        run: |
          swift build --product Tokfuel
          swift build --product TokfuelE2E

      # 失敗時の挙動 GIF は 0.1 秒ごとの PNG を ffmpeg でつなぐ（再生も 0.1 秒/コマ）。
      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Grant Accessibility / Screen Recording TCC
        run: |
          bash App/Tests/E2E/grant-tcc.sh \
            "$PWD/.build/debug/TokfuelE2E" \
            "$PWD/.build/debug/Tokfuel" \
            /usr/bin/osascript \
            /bin/bash \
            /bin/zsh \
            /usr/sbin/screencapture \
            "$(command -v ffmpeg)" \
            "$SHELL"

      # 静止画 screencapture でも Allow が出ることがあるので、先に一度通しておく。
      - name: Warm up Screen Recording Allow
        run: |
          set -euo pipefail
          bash App/Tests/E2E/dismiss-tcc-prompt.sh 20 &
          DISMISS_PID=$!
          for i in 1 2 3 4 5; do
            /usr/sbin/screencapture -x "/tmp/tokfuel-e2e-warmup-${i}.png" >/dev/null 2>&1 || true
            sleep 0.4
          done
          kill "$DISMISS_PID" 2>/dev/null || true
          wait "$DISMISS_PID" 2>/dev/null || true
          if ls /tmp/tokfuel-e2e-warmup-*.png >/dev/null 2>&1; then
            echo "screen recording warm-up ok"
            rm -f /tmp/tokfuel-e2e-warmup-*.png
          else
            echo "warning: warm-up screencapture produced no files (Allow may still be pending)" >&2
          fi

      - name: Run E2E suite
        id: e2e
        env:
          TOKFUEL_E2E_GRANT_TCC: "0"
          SUITE: ${{ matrix.suite }}
        run: |
          if [[ "$SUITE" == "core6" ]]; then
            bash App/Tests/E2E/run-core6.sh
          else
            bash App/Tests/E2E/run-all.sh
          fi

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.suite }}-evidence
          path: |
            .build/e2e/report.json
            .build/e2e/*-last.json
            .build/e2e/failure.png
            .build/e2e/failure.mov
            .build/e2e/failure.gif
            .build/e2e/timeline-*.png
            .build/e2e/baseline/
          if-no-files-found: ignore

      - name: Publish success baselines
        if: success() && matrix.suite == 'core6'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash App/Tests/E2E/publish-baselines.sh

      - name: Comment failure evidence on PR
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash App/Tests/E2E/comment-failure.sh

  cleanup:
    name: Remove E2E failure images on close
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Remove this PR's failure evidence
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BRANCH="e2e-failure-images"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH" 2>/dev/null || exit 0
          git switch -C "$BRANCH" "origin/$BRANCH"
          shopt -s nullglob
          files=(pr-${PR_NUMBER}-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no evidence for PR #${PR_NUMBER}"
            exit 0
          fi
          git rm -f -- "${files[@]}"
          git commit -m "chore: remove e2e failure evidence for PR #${PR_NUMBER}"
          git push origin "$BRANCH"
