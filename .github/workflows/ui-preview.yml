name: UI Preview

# ui-preview 📸 ラベルを付けると、メニューバー・設定・About・予算アラート・初回
# Analytics 同意ダイアログの全画面（下の ORDER にある一覧。同じ画面の別状態も含む）を
# 実物の UI からレンダリングし、PR コメントに絵として貼る
# （TF-0034 / TF-0097）。render は Scripts/ui-preview.sh + ScreenshotRenderer.swift の
# `allScreens()`（README 用スクリーンショットを撮る TF-0015 の `renderPNG` を土台にした拡張）に
# 任せ、ここでは撮った PNG 群を publish するだけ。
# PopoverView / SettingsView / AboutView / 新規の単独 View を足したら、
# `ScreenshotRenderer.allScreens()` と下の ORDER / screen_title も同じ PR で更新する。
#
# コメント本文は 2 列の HTML サムネ格子にする（縦積みだと画面数が増えたとき見渡せない）。
# 各セルは小さめ画像 + 「原寸を開く」リンクで、同じ raw.githubusercontent.com URL を指す。
#
# コメントに画像を直接添付する API は無いため、専用の orphan branch (ui-preview-images) に
# PNG 群を push し、公開リポジトリの raw.githubusercontent.com URL を Markdown / HTML 画像として
# 埋め込む。ファイル名にコミット SHA を含めるので、再ラベル付けのたびに新しい URL になり
# CDN キャッシュを気にしなくていい。
#
# fork からの pull_request イベントでは GITHUB_TOKEN が強制的に read-only になる
# （GitHub Actions のセキュリティ既定でリポジトリ側からは変えられない）。そのため fork PR では
# レンダリングまでは動くが push/コメントは失敗する。continue-on-error でジョブを赤くしないだけに
# とどめ、fork 対応は将来の課題とする。

on:
  pull_request:
    types: [labeled, closed]

concurrency:
  group: ui-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Render & publish preview
    if: github.event.action == 'labeled' && github.event.label.name == 'ui-preview 📸'
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Render screens
        run: bash Scripts/ui-preview.sh /tmp/ui-preview

      - name: Publish preview images and comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="ui-preview-images"
          SHORT_SHA="${PR_SHA:0:7}"

          # macos ランナーの既定 bash は 3.2（連想配列非対応）なので case で代用する。
          screen_title() {
            case "$1" in
              popover) echo "メニューバー（ポップオーバー・ダーク）" ;;
              popover-light) echo "ポップオーバー - ライト外観（フッターの操作口コントラスト）" ;;
              popover-update) echo "メニューバー - フッターにアップデートボタンが出た状態" ;;
              popover-cursor-degraded) echo "メニューバー - Cursor の使用量が取得できていない状態" ;;
              popover-cursor-signin) echo "メニューバー - Cursor のサインインが切れた状態" ;;
              popover-sessions) echo "メニューバー - 末尾までスクロールした状態（高コストのセッション）" ;;
              popover-advice) echo "メニューバー - 末尾までスクロールした状態（節約のヒント）" ;;
              popover-advice-expanded) echo "メニューバー - 節約のヒントを開き、プロンプトをコピーできる状態" ;;
              popover-scrolled) echo "メニューバー - ホームを末尾までスクロールした状態" ;;
              popover-more-menu) echo "メニューバー - ⋯ メニューを開いた状態" ;;
              popover-period-today) echo "メニューバー - 集計期間「今日」" ;;
              popover-period-week) echo "メニューバー - 集計期間「今週」" ;;
              popover-period-month) echo "メニューバー - 集計期間「今月」" ;;
              popover-period-year) echo "メニューバー - 集計期間「今年」" ;;
              popover-jpy) echo "メニューバー - 通貨を円にした状態" ;;
              popover-claude-only) echo "メニューバー - コストソース「Claude のみ」" ;;
              popover-combined) echo "メニューバー - コストソース「合算」" ;;
              popover-cumulative) echo "メニューバー - 推移を累積折れ線にした状態" ;;
              settings) echo "設定" ;;
              settings-jpy) echo "設定 - 通貨を円にした状態" ;;
              settings-claude-only) echo "設定 - コストソース「Claude のみ」" ;;
              settings-advanced) echo "設定 - 詳細を開いた状態" ;;
              settings-debug) echo "設定 - デバッグを開いた状態" ;;
              about) echo "Tokfuel について" ;;
              budget-alert) echo "予算アラート" ;;
              analytics-consent) echo "Analytics 同意" ;;
              *) echo "$1" ;;
            esac
          }
          ORDER=(
            popover popover-light popover-update
            popover-cursor-degraded popover-cursor-signin
            popover-sessions popover-advice popover-advice-expanded
            popover-scrolled popover-more-menu
            popover-period-today popover-period-week popover-period-month popover-period-year
            popover-jpy popover-claude-only popover-combined popover-cumulative
            settings settings-jpy settings-claude-only settings-advanced settings-debug
            about budget-alert analytics-consent
          )

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin "$BRANCH" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git switch -C "$BRANCH" "origin/$BRANCH"
          else
            git switch --orphan "$BRANCH"
            git rm -rf . > /dev/null 2>&1 || true
          fi

          # 同じ PR の古いプレビュー画像を消してから、今回分を追加する。
          rm -f "pr-${PR_NUMBER}"-*.png

          # セル HTML。printf の書式は単一引用符に閉じ込め、YAML インデントが本文へ混ざらない
          # ようにする。% は %% でエスケープ（bash 3.2）。
          cell_html() {
            printf '<td width="50%%" valign="top"><p><strong>%s</strong></p><p><a href="%s"><img src="%s" alt="%s" width="400"></a></p><p><a href="%s">原寸を開く</a></p></td>' \
              "$1" "$2" "$2" "$3" "$2"
          }

          TITLES=()
          URLS=()
          ALTS=()
          for screen in "${ORDER[@]}"; do
            SRC="/tmp/ui-preview/${screen}.png"
            [ -f "$SRC" ] || continue
            IMAGE_NAME="pr-${PR_NUMBER}-${SHORT_SHA}-${screen}.png"
            cp "$SRC" "$IMAGE_NAME"
            IMAGE_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}/${IMAGE_NAME}"
            TITLES+=("$(screen_title "$screen")")
            URLS+=("$IMAGE_URL")
            ALTS+=("$screen")
          done

          BODY=$(printf '<!-- ui-preview-bot -->\n### 🖼 UI Preview\n\nRendered at `%s` by `Scripts/ui-preview.sh`.\n\n<table>' "$SHORT_SHA")
          i=0
          count=${#URLS[@]}
          while [ "$i" -lt "$count" ]; do
            BODY="${BODY}"$'\n<tr>\n'
            BODY="${BODY}$(cell_html "${TITLES[$i]}" "${URLS[$i]}" "${ALTS[$i]}")"
            i=$((i + 1))
            if [ "$i" -lt "$count" ]; then
              BODY="${BODY}$(cell_html "${TITLES[$i]}" "${URLS[$i]}" "${ALTS[$i]}")"
              i=$((i + 1))
            else
              BODY="${BODY}<td></td>"
            fi
            BODY="${BODY}"$'\n</tr>'
          done
          BODY="${BODY}"$'\n</table>'

          # ui-preview-images は orphan で .gitignore が無い。render 直後の作業ツリーには
          # Firebase 導入後の巨大な .build/ が残るので、git add -A すると 100MB 超の pack まで
          # stage され push が拒否されてコメントが投稿されない。PNG だけを明示的に載せる。
          rm -rf .build .swiftpm
          shopt -s nullglob
          pngs=("pr-${PR_NUMBER}-${SHORT_SHA}-"*.png)
          if [ ${#pngs[@]} -eq 0 ]; then
            echo "no preview PNGs to publish" >&2
            exit 1
          fi
          git add -- "${pngs[@]}"
          git commit -m "chore: ui preview for PR #${PR_NUMBER} (${SHORT_SHA})"
          git push origin "$BRANCH"

          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.body | startswith("<!-- ui-preview-bot -->"))][0].id // empty')

          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -f body="$BODY" > /dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$BODY" > /dev/null
          fi

  cleanup:
    name: Remove preview image on close
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Remove this PR's preview image
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BRANCH="ui-preview-images"

          if ! git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "no $BRANCH branch, nothing to clean up"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git switch -C "$BRANCH" "origin/$BRANCH"

          shopt -s nullglob
          matches=("pr-${PR_NUMBER}"-*.png)
          if [ ${#matches[@]} -eq 0 ]; then
            echo "no preview image for PR #${PR_NUMBER}"
            exit 0
          fi
          git rm -f "${matches[@]}"
          git commit -m "chore: remove ui preview for PR #${PR_NUMBER}"

          # 他に画像が残っていなければ、ブランチごと消す。
          if [ -z "$(git ls-tree -r HEAD --name-only)" ]; then
            git push origin --delete "$BRANCH"
          else
            git push origin "$BRANCH"
          fi
