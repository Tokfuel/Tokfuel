name: Contributors

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: contributors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    # Guards against re-triggering on this workflow's own commit — belt and
    # suspenders alongside the `[skip ci]` commit-message marker below.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7

      - name: Update contributor list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINNED_LOGIN: akidon0000
        run: ./Scripts/update-contributors.sh

      # main requires changes to land via a PR (repo ruleset), so a direct
      # `git push` to main is rejected — open a PR on a throwaway branch and
      # merge it immediately instead (required_approving_review_count is 0).
      - name: Open and merge a PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README.ja.md
          if git diff --cached --quiet; then
            echo "No contributor changes."
            exit 0
          fi
          branch="contributors-update-${{ github.sha }}"
          git checkout -b "$branch"
          git commit -m "chore(readme): update contributors [skip ci]"
          git push origin "$branch"
          pr_url="$(gh pr create --title "chore(readme): update contributors" \
            --body "Automated contributor list update." \
            --base main --head "$branch")"
          gh pr merge "$pr_url" --squash --delete-branch
