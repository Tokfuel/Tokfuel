name: Release

# 2 通りで起動できる:
# - Actions の「Run workflow」からバージョン（例 v0.0.4）を入力 → main にタグを打って
#   ビルドし、GitHub Release まで自動作成する（推奨フロー）。
# - v* タグを手で push した場合も従来どおり動く。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョン（例: v0.0.4）"
        required: true
      build_number:
        description: "App Store のビルド番号（省略時はコミット数。同一タグの再アップロード時だけ手動で増やす）"
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version must look like v0.0.4, got: $VERSION" >&2; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 手動起動のときは、いまチェックアウトしている main の先頭にタグを打つ。
      # （GITHUB_TOKEN によるタグ push は他のワークフローを起動しないので二重実行にならない）
      - name: Tag main
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test
        run: swift test

      - name: Build & package
        run: bash scripts/release.sh "${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "Tokfuel ${{ steps.version.outputs.version }}" \
            --generate-notes \
            dist/Tokfuel-*.zip

  # App Store Connect へアップロードし審査に提出する（issue #13, オプトイン）。
  # リポジトリ変数 APPSTORE_RELEASE_ENABLED=true を設定するまでスキップされる。
  # needs: release により GitHub Release（zip 配布）が常に先へ出るので、
  # この job が落ちても直接ダウンロード配布はブロックされない。
  # 現状はサンドボックス非対応（issue #5）のため審査は通らない前提。
  # release job とビルドを共有せず作り直すのは意図的（アーティファクト受け渡しの
  # 結合を避ける。このパッケージのビルドは 1〜2 分で再実行のほうが安い）。
  appstore:
    name: Upload to App Store
    needs: release
    if: vars.APPSTORE_RELEASE_ENABLED == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # CFBundleVersion（git rev-list --count）用に全履歴が要る

      - name: Verify required secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MAS_CERT_P12_BASE64: ${{ secrets.MAS_CERT_P12_BASE64 }}
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 \
                   MAS_CERT_P12_BASE64 MAS_CERT_PASSWORD MAS_PROVISIONING_PROFILE_BASE64; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set"; missing=1; }
          done
          exit $missing

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Decode signing assets
        env:
          MAS_CERT_P12_BASE64: ${{ secrets.MAS_CERT_P12_BASE64 }}
          MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$MAS_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/mas.p12"
          echo "$MAS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/mas.provisionprofile"

      - name: Build & upload
        env:
          TOKFUEL_VERSION: ${{ needs.release.outputs.version }}
          TOKFUEL_BUILD_NUMBER: ${{ inputs.build_number }}
          TOKFUEL_SUBMIT_FOR_REVIEW: "true"
          TOKFUEL_TEAM_ID: ${{ secrets.TOKFUEL_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MAS_CERT_P12_PATH: ${{ runner.temp }}/mas.p12
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          MAS_PROVISIONING_PROFILE_PATH: ${{ runner.temp }}/mas.provisionprofile
        run: bundle exec fastlane mac release_appstore

  # README のスクリーンショットを、いま出したバージョンの実 UI から撮り直す（TF-0015）。
  # main へ直接 push はせず PR にする（人の目を一度通す・ブランチ保護と共存できる）。
  # GITHUB_TOKEN で作った PR では他のワークフローが起動しないため、CI は回らない。
  screenshot:
    name: Refresh README screenshot
    needs: release
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write
    steps:
      # タグではなく main を撮る（差分を main に戻すため）。
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Render screenshot
        run: bash scripts/screenshot.sh

      - name: Open a PR if the screenshot changed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if git diff --quiet -- assets/screenshot.png; then
            echo "screenshot is already up to date"
            exit 0
          fi
          BRANCH="claude/screenshot-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "chore(assets): refresh README screenshot for ${VERSION}" \
            -- assets/screenshot.png
          # 同じバージョンを撮り直した場合はブランチを上書きし、PR は再利用する。
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(assets): refresh README screenshot for ${VERSION}" \
            --body "Rendered from the real \`PopoverView\` at ${VERSION} by \`scripts/screenshot.sh\` (TF-0015). Merge if the new screenshot looks right." \
            || echo "a PR for $BRANCH is already open"
