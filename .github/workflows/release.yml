name: Release

# 手動起動はしない（bump は bump-version.yml）。起動は次の 2 通り:
# - main への push で Info.plist が変わったとき（bump PR のマージ。推奨フロー）
# - v* タグを手で push したとき（従来互換・macOS）
# Info.plist 起点で、すでに同名タグがある場合は二重リリースせず成功終了する。
#
# macOS の版の正本は Info.plist の CFBundleShortVersionString。
# GitHub Release / タグは出荷の結果。いま出荷ジョブがあるのは macOS のみ。
on:
  push:
    branches: [main]
    paths: [Info.plist]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-macos:
    name: Build & publish (macOS)
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    # if: の条件式は secrets コンテキストを直接参照できないため、env 経由で一度だけ判定する。
    env:
      HAS_DEVELOPER_ID_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          git fetch --tags --force
          PLATFORM=macos
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            case "$VERSION" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "macOS tag must look like v0.0.4, got: $VERSION" >&2; exit 1 ;;
            esac
            SKIP=false
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            # Keep this as a one-liner: a <<'PY' heredoc at column 0 breaks the
            # surrounding YAML block scalar and the workflow never starts jobs.
            BARE="$(python3 -c 'import plistlib; print(plistlib.load(open("Info.plist", "rb"))["CFBundleShortVersionString"])')"
            case "$BARE" in
              [0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "Info.plist CFBundleShortVersionString must look like 0.0.4, got: $BARE" >&2; exit 1 ;;
            esac
            VERSION="v${BARE}"
            if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
              echo "tag ${VERSION} already exists; skipping release" >&2
              SKIP=true
            else
              SKIP=false
            fi
          else
            echo "unsupported ref: ${GITHUB_REF}" >&2
            exit 1
          fi
          {
            echo "platform=${PLATFORM}"
            echo "version=${VERSION}"
            echo "skip=${SKIP}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release version"
            echo ""
            echo "- Platform: \`${PLATFORM}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Skip: \`${SKIP}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Info.plist 起点のときだけ、いまの main 先頭にタグを打つ。
      # （GITHUB_TOKEN によるタグ push は他のワークフローを起動しないので二重実行にならない）
      - name: Tag main
        if: steps.version.outputs.skip != 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Show toolchain
        if: steps.version.outputs.skip != 'true'
        run: |
          swift --version
          xcodebuild -version

      - name: Test
        if: steps.version.outputs.skip != 'true'
        run: swift test

      # DEVELOPER_ID_P12 が未設定なら何もせず、release.sh は従来どおり ad-hoc 署名で動く。
      - name: Import Developer ID certificate
        if: ${{ steps.version.outputs.skip != 'true' && env.HAS_DEVELOPER_ID_CERT == 'true' }}
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"

          echo "$DEVELOPER_ID_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.+)"/\1/')"
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          rm -f "$CERT_PATH"

      - name: Build & package
        if: steps.version.outputs.skip != 'true'
        run: bash Scripts/release.sh "${{ steps.version.outputs.version }}"

      # 公証は Developer ID 署名済みのときのみ行う（ad-hoc 署名は notarytool が reject する）。
      - name: Notarize & staple
        if: ${{ steps.version.outputs.skip != 'true' && env.HAS_DEVELOPER_ID_CERT == 'true' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          APP_STORE_CONNECT_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APP_STORE_CONNECT_KEY" | base64 --decode > "$APP_STORE_CONNECT_KEY_PATH"
          export APP_STORE_CONNECT_KEY_PATH
          bash Scripts/notarize.sh "${{ steps.version.outputs.version }}"
          rm -f "$APP_STORE_CONNECT_KEY_PATH"

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSIONED_DMG="$(ls dist/Tokfuel-*.dmg)"

          # 固定名のコピーも添付する。ダウンロードページはバージョンを知らずに
          # releases/latest/download/Tokfuel-latest.dmg を直リンクできる。
          cp "$VERSIONED_DMG" dist/Tokfuel-latest.dmg

          gh release create "${{ steps.version.outputs.version }}" \
            --title "Tokfuel ${{ steps.version.outputs.version }}" \
            --generate-notes \
            "$VERSIONED_DMG" dist/Tokfuel-latest.dmg

  # README / Site のスクリーンショットを、いま出したバージョンの実 UI から撮り直す
  # （TF-0015 / #62）。main へ直接 push はせず PR にする（人の目を一度通す・
  # ブランチ保護と共存できる）。GITHUB_TOKEN で作った PR では他のワークフローが
  # 起動しないため、CI は回らない。
  screenshot:
    name: Refresh README and Site screenshots
    needs: release-macos
    if: needs.release-macos.outputs.skip != 'true'
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write
    steps:
      # タグではなく main を撮る（差分を main に戻すため）。
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Render screenshot
        run: bash Scripts/screenshot.sh

      - name: Open a PR if the screenshot changed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-macos.outputs.version }}
        run: |
          PATHS=(Assets/screenshot.png Site/Assets/images/screenshot.png)
          if git diff --quiet -- "${PATHS[@]}"; then
            echo "screenshot is already up to date"
            exit 0
          fi
          BRANCH="claude/screenshot-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "chore(assets): refresh README/Site screenshot for ${VERSION}" \
            -- "${PATHS[@]}"
          # 同じバージョンを撮り直した場合はブランチを上書きし、PR は再利用する。
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(assets): refresh README/Site screenshot for ${VERSION}" \
            --body "Rendered from the real \`PopoverView\` at ${VERSION} by \`Scripts/screenshot.sh\` (#62). Updates both README and the download page. Merge if the new screenshot looks right." \
            || echo "a PR for $BRANCH is already open"
