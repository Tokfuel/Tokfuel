name: Release

# v1.2.3 形式のタグを push すると、ユニバーサルビルドの Tokfuel.app を zip にして
# GitHub Release に添付する。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build & package
        run: bash scripts/release.sh "${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Tokfuel ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/Tokfuel-*.zip
