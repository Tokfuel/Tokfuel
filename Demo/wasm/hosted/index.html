<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tokfuel Demo — SwiftUI source</title>
  <script type="importmap">
  {
    "imports": {
      "@bjorn3/browser_wasi_shim": "https://cdn.jsdelivr.net/npm/@bjorn3/browser_wasi_shim@0.3.0/+esm"
    }
  }
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background:
        radial-gradient(1200px 600px at 20% 0%, #2a3344 0%, transparent 55%),
        linear-gradient(180deg, #1a1f2a 0%, #0c0e12 55%, #050607 100%);
      color: #f5f5f7;
    }
    .banner {
      margin: 0;
      padding: 10px 16px;
      background: rgba(0,0,0,0.45);
      color: rgba(235,235,245,0.6);
      font-size: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .stage { display: flex; justify-content: center; padding: 24px 16px; }
    #app { min-width: 360px; }
    .footnote { text-align: center; color: rgba(235,235,245,0.6); font-size: 12px; padding-bottom: 24px; }
    .footnote a { color: #2997ff; }
    .status-box {
      max-width: 560px; margin: 0 auto 24px; padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
      background: rgba(30,30,30,0.7); color: rgba(235,235,245,0.6); font-size: 13px;
    }
  </style>
</head>
<body>
  <p class="banner">
    正本は DemoUI（SwiftUI 形の構成）。ローカル TokamakDOM シム経由で描画します。
    <br />Fixture-only. No usage data is read or sent.
  </p>
  <main class="stage"><div id="app"><div style="padding:24px;opacity:.6">Starting…</div></div></main>
  <div class="status-box" id="status" hidden></div>
  <p class="footnote"><a href="../">比較入口へ戻る</a> · <a href="https://github.com/Tokfuel/Tokfuel/issues/155">#155</a></p>
  <script type="module">
    const status = document.getElementById("status");
    async function boot() {
      try {
        const head = await fetch("./TokfuelDemo.wasm", { method: "HEAD" });
        if (!head.ok) throw new Error("TokfuelDemo.wasm missing");
        const { init } = await import("./index.js");
        await init();
      } catch (err) {
        status.hidden = false;
        status.innerHTML = `Build with <code>bash Scripts/build-wasm-demo.sh</code>.<br/><code>${String(err.message || err)}</code>`;
      }
    }
    boot();
  </script>
</body>
</html>
